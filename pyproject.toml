[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sattva-ai"
version = "1.1.0"
description = "Autonomous Local AI Coding Assistant & Multi-Agent Team powered by Ollama with Web UI and Interactive CLI"
authors = [{ name = "SATTVA AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "pydantic>=2.6.0",
]

[project.scripts]
sattva = "sattva.main:main"
sattva-ai = "sattva.main:main"
sattva-web = "sattva_web:run_web"

